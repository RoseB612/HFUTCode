server:
  port: ${SERVER_PORT:9202}

jwt:
  secret: ${JWT_SECRET:zshadioasjdkasdsadassa}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:syncode_dev}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:syncode}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-me-local}}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:change-me-local}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  cloud:
    discovery:
      client:
        simple:
          instances:
            oj-judge:
              - uri: ${OJ_JUDGE_BASE_URL:http://127.0.0.1:9204}
            oj-agent:
              - uri: ${AGENT_PUBLIC_BASE_URL:http://127.0.0.1:8015}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

mail:
  host: smtp.qq.com
  port: 587
  username: your_email@qq.com
  password: your_smtp_auth_code
  from: your_email@qq.com
  subject: OnlineOJ email code
  auth: true
  starttls: true
  starttls-required: true
  ssl-protocols: TLSv1.2
  code-expiration: 5
  send-limit: 3
  is-send: false

file:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:syncode}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000}
    path-prefix: ${MINIO_PATH_PREFIX:resume/}

resume:
  upload:
    max-file-size-mb: ${RESUME_UPLOAD_MAX_FILE_SIZE_MB:10}
    daily-limit: ${RESUME_UPLOAD_DAILY_LIMIT:10}
  reanalyze:
    daily-limit: ${RESUME_REANALYZE_DAILY_LIMIT:20}

training:
  agent:
    service-id: ${AGENT_SERVICE_NAME:oj-agent}
    base-url: ${AGENT_PUBLIC_BASE_URL:http://127.0.0.1:8015}
    plan-path: /api/training/plan
    candidate-limit: 40
    client:
      connect-timeout-ms: 1000
      request-timeout-ms: 30000
      max-attempts: 3
      retry-backoff-ms: 200
      circuit-failure-threshold: 5
      circuit-open-ms: 30000
      rate-limit-per-minute: 60
