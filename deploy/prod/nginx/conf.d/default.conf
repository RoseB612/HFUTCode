map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker containers can receive a different IP whenever Compose recreates them.
# Resolve service names through Docker DNS continuously so Nginx never keeps a
# stale address and accidentally routes web traffic to app/admin.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_upstream {
  zone web_upstream 64k;
  server web:3000 resolve;
}

upstream app_upstream {
  zone app_upstream 64k;
  server app:3000 resolve;
}

upstream admin_upstream {
  zone admin_upstream 64k;
  server admin:3000 resolve;
}

upstream friend_upstream {
  zone friend_upstream 64k;
  server friend:9202 resolve;
}

server {
  listen 80 default_server;
  server_name hfut.top www.hfut.top 124.223.30.115 _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /admin/ {
    proxy_pass http://admin_upstream;
  }

  location = /admin {
    proxy_pass http://admin_upstream;
  }

  location /app/ {
    proxy_pass http://app_upstream;
  }

  location = /app {
    proxy_pass http://app_upstream;
  }

  location / {
    proxy_pass http://web_upstream;
  }
}

server {
  listen 80;
  server_name api.hfut.top;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location / {
    proxy_pass http://friend_upstream;
  }
}
